<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
      :root {
        --bg: #12101c;
        --card: #faf7f0;
        --ink: #2b2620;
        --violet: #8b5cf6;
        --cyan: #22d3ee;
        --muted: #8a8072;
        --line: #e4ddcc;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 50% 0%, #201c3a 0%, var(--bg) 55%);
        color: var(--ink);
        font-family: 'Segoe UI', system-ui, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border-radius: 18px;
        padding: 40px 32px;
        box-shadow: 0 20px 60px -12px rgba(139, 92, 246, 0.35);
      }

      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--violet);
        margin: 0 0 8px;
        font-weight: 700;
      }

      h1 {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 28px;
        margin: 0 0 28px;
        color: var(--ink);
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: #ffffff;
        color: var(--ink);
        font-size: 15px;
        margin-bottom: 14px;
        outline: none;
      }

      input:focus {
        border-color: var(--violet);
      }

      button {
        width: 100%;
        background: linear-gradient(90deg, var(--violet), var(--cyan));
        border: none;
        color: #0f0d1a;
        font-weight: 700;
        padding: 14px;
        border-radius: 10px;
        font-size: 15px;
        cursor: pointer;
        margin-top: 6px;
        transition: opacity 0.2s ease;
      }

      button:hover {
        opacity: 0.9;
      }

      p.switch {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        margin-top: 20px;
      }

      p.switch a {
        color: var(--violet);
        text-decoration: none;
        font-weight: 600;
      }

      p.switch a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="eyebrow">Welcome back</p>
      <h1>Login</h1>
      <input type="text" id="usernameInput" placeholder="Username" />
      <input type="password" id="passwordInput" placeholder="Password" />
      <button id="loginBtn">Login</button>
      <p class="switch">Don't have an account? <a href="/quiz">Take the quiz</a></p>
    </div>

    <script>
      document.getElementById("loginBtn").addEventListener("click", () => {
        const username = document.getElementById("usernameInput").value;
        const password = document.getElementById("passwordInput").value;

        fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        })
          .then(response => response.json())
          .then(data => {
            if (data.success) {
              window.location.href = "/";
            } else {
              alert(data.error);
            }
          });
      });
    </script>
  </body>
</html>
