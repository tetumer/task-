<style>
    .mainNav {
        width: calc(100% - 40px);
        max-width: 1200px;
        margin: 20px auto;

        display: flex;
        align-items: center;
        gap: 28px;

        padding: 12px 18px;

        background: white;
        border-radius: 16px;

        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

        font-family: Arial, sans-serif;
    }

    /

    .navLogo {
        display: flex;
        align-items: center;
        gap: 7px;

        text-decoration: none;
        color: #222;

        white-space: nowrap;
        flex-shrink: 0;
    }

    .navChinese {
        font-size: 28px;
        font-weight: bold;
    }

    .navBrand {
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 1px;
    }


    /* =========================
       LINKS
    ========================= */

    .navLinks {
        display: flex;
        align-items: center;
        gap: 5px;

        flex: 1;
        min-width: 0;
    }

    .navLinks a {
        padding: 9px 13px;

        border-radius: 9px;

        text-decoration: none;
        color: #555;

        font-size: 15px;

        white-space: nowrap;

        transition:
            background 0.2s ease,
            color 0.2s ease;
    }

    .navLinks a:hover {
        background: #f1f1f1;
        color: #222;
    }

    .navLinks a.active {
        background: #222;
        color: white;
    }


    /* =========================
       RIGHT SIDE
    ========================= */

    .navRight {
        display: flex;
        align-items: center;
        gap: 10px;

        flex-shrink: 0;
    }

    .navWallet {
        display: flex;
        align-items: center;
        gap: 4px;

        font-weight: bold;
        white-space: nowrap;

        padding: 7px 9px;
        border-radius: 9px;
        background: #f5f5f5;
    }

    #logoutBtn {
        padding: 9px 14px;

        border: none;
        border-radius: 9px;

        background: #eee;
        color: #333;

        cursor: pointer;

        font-size: 14px;

        white-space: nowrap;
    }

    #logoutBtn:hover {
        background: #ddd;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {

        .mainNav {
            gap: 15px;
        }

        .navLinks a {
            padding: 8px 10px;
            font-size: 14px;
        }

        .navBrand {
            font-size: 17px;
        }
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        .mainNav {
            width: calc(100% - 20px);

            margin: 10px auto;
            padding: 10px;

            display: grid;

            grid-template-columns: auto 1fr auto;
            grid-template-areas:
                "logo wallet logout"
                "links links links";

            gap: 10px;

            border-radius: 14px;
        }


        /* LOGO */

        .navLogo {
            grid-area: logo;

            gap: 5px;
        }

        .navChinese {
            font-size: 24px;
        }

        .navBrand {
            font-size: 16px;
            letter-spacing: 0.7px;
        }


        /* WALLET */

        .navRight {
            grid-area: wallet;

            display: contents;
        }

        .navWallet {
            grid-area: wallet;

            justify-self: end;

            padding: 7px 9px;

            font-size: 14px;
        }


        /* LOGOUT */

        #logoutBtn {
            grid-area: logout;

            padding: 8px 11px;

            font-size: 13px;
        }


        /* LINKS */

        .navLinks {
            grid-area: links;

            width: 100%;

            display: flex;

            gap: 6px;

            overflow-x: auto;

            padding: 2px 0;

            /*
             * Hide scrollbar while keeping
             * horizontal scrolling available.
             */
            scrollbar-width: none;

            -webkit-overflow-scrolling: touch;
        }

        .navLinks::-webkit-scrollbar {
            display: none;
        }

        .navLinks a {
            flex: 1 0 auto;

            padding: 9px 14px;

            font-size: 14px;

            text-align: center;
        }
    }


    /* =========================
       VERY SMALL PHONES
    ========================= */

    @media (max-width: 380px) {

        .mainNav {
            width: calc(100% - 14px);
            padding: 8px;

            gap: 8px;
        }

        .navChinese {
            font-size: 22px;
        }

        .navBrand {
            font-size: 15px;
        }

        .navWallet {
            font-size: 13px;
            padding: 6px 8px;
        }

        #logoutBtn {
            padding: 7px 9px;
            font-size: 12px;
        }

        .navLinks {
            gap: 4px;
        }

        .navLinks a {
            padding: 8px 11px;
            font-size: 13px;
        }
    }
</style>


<nav class="mainNav">

    <a href="/" class="navLogo">
        <span class="navChinese">我</span>
        <span class="navBrand">MOI</span>
    </a>

    <div class="navLinks">
        <a href="/" data-path="/">Home</a>
        <a href="/addtask" data-path="/addtask">Add Task</a>
        <a href="/shop" data-path="/shop">Shop</a>
        <a href="/profile/page" data-path="/profile/page">Profile</a>
    </div>

    <div class="navRight">

        <span class="navWallet">
            💰 <span id="navWalletBalance">0</span>
        </span>

        <button id="logoutBtn">Logout</button>

    </div>

</nav>
